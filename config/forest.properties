# Configuration de la simulation de feu de foret
# Format libre choisi : java.util.Properties (cle=valeur), sans dependance externe.

# Dimensions de la grille
grid.height=10
grid.width=15

# Probabilite qu'une case en feu enflamme une case adjacente saine (entre 0.0 et 1.0)
propagation.probability=0.50

# Positions initialement en feu, format "ligne,colonne" separees par ';'
fire.initial=5,7

# Seed optionnelle pour rendre la simulation reproductible (retirer la ligne pour de l'aleatoire pur)
simulation.seed=42
